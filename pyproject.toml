[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futeq-sentinel"
version = "0.0.1"
description = "NSE F&O position-limit and ban-period engine"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "pydantic",
    "pandera",
    "scipy",
    "PyYAML",
    "requests",
    "jinja2",
    "matplotlib",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `pythonpath` means `pytest` works from the repo root with no install step. Without it,
# `import sentinel` fails, because the package lives under src/ and is not on sys.path.
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # An assumed threshold must not be silently swallowed in a test run either.
    "error::UserWarning",
]
